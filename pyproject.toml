[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "electricity-price-forecasting"
version = "1.0.0"
description = "Probabilistic day-ahead electricity price forecasting for European bidding zones"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "lightgbm>=4.3,<5", "joblib>=1.3,<2", "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3", "requests>=2.31,<3"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
[project.scripts]
power-price = "power_price.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
